@if (showWelcomeToast) {
  <app-welcome-toast
    (dismiss)="onWelcomeDismiss()"
    (openSettings)="openConfigDialog()"
  />
}

<app-nav-bar
  (settingsClick)="openConfigDialog()"
  (helpClick)="showWelcome()"
  (anchorClick)="onNavAnchorClick()"
/>

<div id="top" class="container mx-auto px-3 py-4 sm:p-4">
  <div class="flex flex-wrap sm:flex-nowrap items-center sm:justify-start gap-8 w-full mb-6">
    <div class="grow min-w-48 max-w-md sm:max-w-60">
      <app-current-gif></app-current-gif>
    </div>
  </div>

  <section id="favorites" class="scroll-mt-20 sm:scroll-mt-16">
    <app-favorites></app-favorites>
  </section>

  <section id="playlists" class="scroll-mt-20 sm:scroll-mt-16">
    <app-playlists></app-playlists>
  </section>

  <section id="all-animations" class="scroll-mt-20 sm:scroll-mt-16">
    <h2 class="text-xl font-semibold mb-2"><i class="fas fa-images text-cyan-500"></i> All animations</h2>
    <app-gif-grid-infinite></app-gif-grid-infinite>
  </section>
</div>
